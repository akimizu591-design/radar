<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06140c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>お気に入りレーダー</title>
<style>
  :root{
    --bg:#06140c; --panel:#0d2216; --line:#1f5a38; --grid:#2c8a55;
    --text:#d8f5e3; --dim:#7fae93; --accent:#ffd84a; --bike:#ff7a59;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-tap-highlight-color:transparent}
  body{padding:env(safe-area-inset-top) 12px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:10px 2px 6px}
  h1{font-size:17px;margin:0;letter-spacing:.04em;white-space:nowrap}
  #status{font-size:11px;color:var(--dim);text-align:right;padding-left:10px}
  #radarWrap{position:relative;width:100%;max-width:min(100%,62vh);margin:0 auto;aspect-ratio:1}
  canvas{width:100%;height:100%;display:block;border-radius:50%;touch-action:manipulation}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  button,.btn{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;min-height:44px;cursor:pointer}
  button:active{filter:brightness(1.4)}
  button:disabled{opacity:.7}
  .seg button{font-size:14px}
  .seg button{flex:1;padding:8px 0}
  .seg button.on{background:var(--grid);color:#04130a;font-weight:700;border-color:var(--grid)}
  .primary{background:var(--bike);border-color:var(--bike);color:#1c0a04;font-weight:700;flex:1}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
  .panel h2{font-size:13px;color:var(--dim);margin:0 0 8px;font-weight:600}
  .big{font-size:22px;font-weight:700}
  .sub{font-size:12px;color:var(--dim);margin-top:2px;word-break:break-all}
  a{color:var(--accent)}
  ul{list-style:none;margin:0;padding:0}
  #near li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line);cursor:pointer}
  #near li:first-child{border-top:0}
  .arrow{width:22px;height:22px;flex:none;display:inline-block;transition:transform .15s linear}
  .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ds{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;white-space:nowrap}
  .dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
  #lists li{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line)}
  #lists li:first-child{border-top:0}
  #hiddenList li{display:flex;align-items:center;gap:10px;padding:6px 2px;border-top:1px solid var(--line)}
  #lists label{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
  #lists input{width:20px;height:20px;flex:none}
  .small{padding:6px 10px;min-height:36px;font-size:13px}
  #photo{max-width:100%;border-radius:8px;margin-top:8px;display:block}
  .hide{display:none!important}
  #msg{font-size:13px;color:var(--accent);min-height:1.2em;margin:6px 2px}
</style>
</head>
<body>
<header>
  <h1>お気に入りレーダー</h1>
  <div id="status">位置情報を取得中…</div>
</header>

<div id="radarWrap"><canvas id="cv"></canvas></div>
<div id="msg"></div>
<button id="compassBtn" class="hide">コンパスを有効にする</button>

<div class="row seg" id="ranges"></div>

<div class="panel hide" id="sel">
  <h2>選択中</h2>
  <div class="big" id="selDist"></div>
  <div id="selName"></div>
  <div class="sub" id="selAddr"></div>
  <div class="row">
    <a class="btn" id="selLink" target="_blank" rel="noopener">Googleマップで開く</a>
    <button id="selHide">この地点を隠す</button>
    <button id="selClear">選択を解除</button>
  </div>
</div>

<div class="panel">
  <h2>🚲 自転車</h2>
  <div id="bikeInfo" class="sub">まだ保存されていません</div>
  <img id="photo" class="hide" alt="停めた場所の写真">
  <div class="row">
    <button class="primary" id="bikeSave">ここに停めた</button>
    <button id="bikeFind" class="hide">探す</button>
  </div>
  <div class="row" id="bikeMore">
    <button class="small" id="bikeMemo">メモ</button>
    <button class="small" id="bikePhotoBtn">写真</button>
    <button class="small" id="bikeDel">消す</button>
    <input type="file" id="bikePhotoIn" accept="image/*" capture="environment" class="hide">
  </div>
</div>

<div class="panel">
  <h2>近い順</h2>
  <ul id="near"><li class="sub">地点がありません。下の「ファイルを読み込む」から追加してください。</li></ul>
</div>

<div class="panel">
  <h2>リスト</h2>
  <ul id="lists"></ul>
  <div class="row">
    <button id="importBtn">ファイルを読み込む</button>
    <button id="addHere">現在地を登録</button>
    <input type="file" id="importIn" accept=".json,.csv,application/json,text/csv" multiple class="hide">
  </div>
  <div id="hiddenBox" class="hide">
    <div class="row">
      <button class="small" id="hiddenToggle"></button>
      <button class="small hide" id="hiddenAll">すべて戻す</button>
    </div>
    <ul id="hiddenList"></ul>
  </div>
  <div class="sub">Googleデータエクスポートの .json / .csv を選べます。データはこのスマホの中だけに保存されます。</div>
</div>


<script>
/* ===== 計算と読み込み（純粋な関数） ===== */
const EARTH = 6371000;
const rad = d => d * Math.PI / 180;

function distBear(a, b) {
  const p1 = rad(a.lat), p2 = rad(b.lat), dl = rad(b.lng - a.lng);
  const h = Math.sin((p2 - p1) / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  const d = 2 * EARTH * Math.asin(Math.min(1, Math.sqrt(h)));
  const y = Math.sin(dl) * Math.cos(p2);
  const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
  return { d, b: (Math.atan2(y, x) * 180 / Math.PI + 360) % 360 };
}
function fmtDist(m) {
  if (m < 1000) return Math.round(m) + 'm';
  if (m < 10000) return (m / 1000).toFixed(1) + 'km';
  return Math.round(m / 1000) + 'km';
}
function dirName(b) {
  return ['北', '北東', '東', '南東', '南', '南西', '西', '北西'][Math.round(b / 45) % 8];
}
function validLL(lat, lng) {
  return isFinite(lat) && isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180 && !(lat === 0 && lng === 0);
}

// Takeoutの「保存した場所.json」「クチコミ.json」など（GeoJSON）
function parseGeoJSON(text) {
  const data = JSON.parse(text);
  const places = [];
  for (const f of (data.features || [])) {
    const c = f.geometry && f.geometry.coordinates;
    if (!c) continue;
    const lng = Number(c[0]), lat = Number(c[1]);
    if (!validLL(lat, lng)) continue;
    const p = f.properties || {}, loc = p.location || {};
    places.push({
      name: loc.name || p.name || p.Title || '名前なし',
      addr: (loc.address || '').replace(/^日本、/, ''),
      url: p.google_maps_url || '',
      lat, lng
    });
  }
  return { places, pending: [] };
}

function parseCSVRows(text) {
  const rows = []; let row = [], cur = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cur); rows.push(row); row = []; cur = '';
    } else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

// Takeoutの「保存済み」のCSV（タイトル,メモ,URL,…）
// 座標がURLに入っている行だけ地点にし、残りは pending（あとで変換）に入れる
function parseTakeoutCSV(text) {
  const rows = parseCSVRows(text);
  const places = [], pending = [];
  let skipped = 0;
  for (let i = 1; i < rows.length; i++) {
    const [title, memo, url] = rows[i];
    if (!url) continue;
    const m = url.match(/google\.[^/]+\/maps\/search\/(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/);
    if (m && validLL(+m[1], +m[2])) {
      places.push({ name: memo || title || '指定した地点', addr: '', url, lat: +m[1], lng: +m[2] });
    } else if (/google\.[^/]+\/maps\//.test(url)) {
      pending.push({ name: title || '名前なし', memo: memo || '', url });
    } else skipped++;
  }
  return { places, pending, skipped };
}
/* ===== ここまで純粋な関数 ===== */

/* ===== 保存データ ===== */
const COLORS = ['#ffd84a', '#5ad1ff', '#ff9df0', '#7dff8a', '#ffa94d', '#c9a6ff', '#ff6b6b'];
const RANGES = [50, 300, 1000, 3000, 5000];
const store = {
  get(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
let lists = store.get('radar.lists', []);
let bike = store.get('radar.bike', null);
let range = store.get('radar.range', 1000);
let pos = null;          // {lat,lng,acc}
let heading = null;      // 0=北。null ならコンパスなし
let selected = null;     // {type:'bike'} か {type:'place', li, pi}
let hits = [];           // 画面上の点（タップ判定用）
let hidden = new Set(store.get('radar.hidden', []));  // 個別に隠した地点
const pk = p => p.url || (p.name + '@' + p.lat + ',' + p.lng);
function saveHidden() { store.set('radar.hidden', [...hidden]); }
let showHidden = false;
let collecting = null;   // 自転車保存のための測位中 {best, timer}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function say(t) { $('msg').textContent = t; if (t) setTimeout(() => { if ($('msg').textContent === t) $('msg').textContent = ''; }, 6000); }
function saveLists() { if (!store.set('radar.lists', lists)) say('保存できませんでした（容量不足）'); }

/* ===== 位置とコンパス ===== */
if ('geolocation' in navigator) {
  navigator.geolocation.watchPosition(p => {
    pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy };
    renderAll();
    if (collecting) onFix();
  }, e => {
    $('status').textContent = e.code === 1 ? '位置情報が許可されていません' : '位置情報を取得できません';
  }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
} else $('status').textContent = 'この端末は位置情報に対応していません';

function onOri(e) {
  let h = null;
  if (typeof e.webkitCompassHeading === 'number') h = e.webkitCompassHeading;
  else if (e.absolute && e.alpha != null) h = 360 - e.alpha;
  if (h == null) return;
  h = (h + ((screen.orientation && screen.orientation.angle) || 0) + 360) % 360;
  if (heading == null) heading = h;
  else { const diff = ((h - heading + 540) % 360) - 180; heading = (heading + diff * 0.25 + 360) % 360; }
  $('compassBtn').classList.add('hide');
  needDraw = true;
}
function startCompass() {
  if ('ondeviceorientationabsolute' in window) addEventListener('deviceorientationabsolute', onOri);
  else addEventListener('deviceorientation', onOri);
}
startCompass();
if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
  setTimeout(() => { if (heading == null) $('compassBtn').classList.remove('hide'); }, 1500);
  $('compassBtn').onclick = () => DeviceOrientationEvent.requestPermission().then(r => {
    if (r === 'granted') { startCompass(); $('compassBtn').classList.add('hide'); }
  }).catch(() => {});
}

/* ===== 地点の一覧を作る ===== */
function allPoints() {
  if (!pos) return [];
  const out = [];
  lists.forEach((l, li) => {
    if (!l.visible) return;
    l.places.forEach((p, pi) => {
      if (hidden.has(pk(p))) return;
      const r = distBear(pos, p);
      out.push({ type: 'place', li, pi, name: p.name, addr: p.addr, url: p.url, lat: p.lat, lng: p.lng, color: l.color, d: r.d, b: r.b });
    });
  });
  if (bike) {
    const r = distBear(pos, bike);
    out.push({ type: 'bike', name: '自転車', addr: bike.memo || '', lat: bike.lat, lng: bike.lng, color: '#ff7a59', d: r.d, b: r.b });
  }
  return out;
}
const isSel = p => selected && selected.type === p.type && (p.type === 'bike' || (selected.li === p.li && selected.pi === p.pi));

/* ===== レーダー描画 ===== */
const cv = $('cv'), ctx = cv.getContext('2d');
let needDraw = true, points = [];
function sizeCanvas() {
  const w = cv.clientWidth, dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = cv.height = Math.round(w * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  needDraw = true;
}
addEventListener('resize', sizeCanvas);

function draw() {
  const W = cv.clientWidth, c = W / 2, R = c - 14, hd = heading || 0;
  ctx.clearRect(0, 0, W, W);
  ctx.fillStyle = '#082015'; ctx.beginPath(); ctx.arc(c, c, c, 0, 7); ctx.fill();
  // 目盛りの輪
  ctx.strokeStyle = '#2c8a55'; ctx.lineWidth = 1; ctx.fillStyle = '#7fae93';
  ctx.font = '11px system-ui'; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  for (let i = 1; i <= 3; i++) {
    ctx.globalAlpha = i === 3 ? 1 : .55;
    ctx.beginPath(); ctx.arc(c, c, R * i / 3, 0, 7); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillText(fmtDist(range * i / 3), c + R * i / 3 * .7071 - 5, c - R * i / 3 * .7071 + 5);
  }
  // 十字線（進行方向基準）
  ctx.globalAlpha = .4;
  ctx.beginPath(); ctx.moveTo(c - R, c); ctx.lineTo(c + R, c); ctx.moveTo(c, c - R); ctx.lineTo(c, c + R); ctx.stroke();
  ctx.globalAlpha = 1;
  // 方位の文字
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 13px system-ui';
  [['北', 0], ['東', 90], ['南', 180], ['西', 270]].forEach(([t, deg]) => {
    const a = rad(deg - hd);
    ctx.fillStyle = deg === 0 ? '#ff6b6b' : '#7fae93';
    ctx.fillText(t, c + (R + 7) * Math.sin(a), c - (R + 7) * Math.cos(a));
  });
  // 地点
  hits = [];
  const order = points.slice().sort((a, b) => (isSel(a) - isSel(b)) || ((a.type === 'bike') - (b.type === 'bike')));
  for (const p of order) {
    const a = rad(p.b - hd), out = p.d > range;
    const r = out ? R : R * p.d / range;
    const x = c + r * Math.sin(a), y = c - r * Math.cos(a);
    const sel = isSel(p);
    if (sel) {
      ctx.strokeStyle = p.color; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
      ctx.beginPath(); ctx.moveTo(c, c); ctx.lineTo(x, y); ctx.stroke(); ctx.setLineDash([]);
    }
    if (p.type === 'bike') {
      const er = R * Math.hypot(bike.acc || 0, pos ? pos.acc : 0) / range;
      if (!out && er > 16) {
        ctx.fillStyle = 'rgba(255,122,89,.16)'; ctx.strokeStyle = 'rgba(255,122,89,.6)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(x, y, er, 0, 7); ctx.fill(); ctx.stroke();
      }
      ctx.fillStyle = p.color; ctx.strokeStyle = '#1c0a04'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, 11, 0, 7); ctx.fill(); ctx.stroke();
      ctx.font = '13px system-ui'; ctx.fillStyle = '#1c0a04'; ctx.fillText('🚲', x, y + 1);
    } else if (out) {
      ctx.globalAlpha = sel ? 1 : .55; ctx.strokeStyle = p.color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, 3.5, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(x, y, sel ? 7 : 5, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    }
    if (sel) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, p.type === 'bike' ? 15 : 11, 0, 7); ctx.stroke(); }
    hits.push({ x, y, p });
  }
  // 自分
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(c, c - 9); ctx.lineTo(c + 6, c + 6); ctx.lineTo(c, c + 2); ctx.lineTo(c - 6, c + 6); ctx.closePath(); ctx.fill();
  if (!pos) {
    ctx.fillStyle = '#7fae93'; ctx.font = '13px system-ui';
    ctx.fillText('位置情報を待っています…', c, c + 34);
  }
  // 一覧の矢印も回す
  document.querySelectorAll('#near .arrow').forEach(el => { el.style.transform = `rotate(${Number(el.dataset.b) - hd}deg)`; });
}
(function loop() { if (needDraw) { needDraw = false; draw(); } requestAnimationFrame(loop); })();

cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  let best = null, bd = 26;
  for (const h of hits) { const d = Math.hypot(h.x - x, h.y - y); if (d < bd) { bd = d; best = h.p; } }
  selected = best ? (best.type === 'bike' ? { type: 'bike' } : { type: 'place', li: best.li, pi: best.pi }) : null;
  renderAll();
});

/* ===== 画面の各パネル ===== */
const ARROW = c => `<svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2l7 18-7-4-7 4z" fill="${c}"/></svg>`;

function renderStatus() {
  if (!pos) return;
  $('status').textContent = `GPS誤差 ±${Math.round(pos.acc)}m` + (heading == null ? '・コンパスなし（上が北）' : '');
}
function renderNear() {
  const ul = $('near');
  if (!pos) { ul.innerHTML = '<li class="sub">位置情報を待っています…</li>'; return; }
  const top = points.filter(p => p.type === 'place').sort((a, b) => a.d - b.d).slice(0, 12);
  if (!top.length) { ul.innerHTML = '<li class="sub">地点がありません。下の「ファイルを読み込む」から追加してください。</li>'; return; }
  ul.innerHTML = top.map(p =>
    `<li data-li="${p.li}" data-pi="${p.pi}"><span class="arrow" data-b="${p.b}">${ARROW(p.color)}</span>` +
    `<span class="nm">${esc(p.name)}</span><span class="ds">${dirName(p.b)} ${fmtDist(p.d)}</span></li>`).join('');
}
$('near').addEventListener('click', e => {
  const li = e.target.closest('li[data-li]'); if (!li) return;
  selected = { type: 'place', li: +li.dataset.li, pi: +li.dataset.pi };
  renderAll(); scrollTo({ top: 0, behavior: 'smooth' });
});

function renderSel() {
  const p = points.find(isSel);
  $('sel').classList.toggle('hide', !p);
  if (!p) return;
  $('selDist').textContent = `${dirName(p.b)} ${fmtDist(p.d)}`;
  $('selName').textContent = p.name;
  $('selAddr').textContent = p.addr || '';
  $('selLink').href = p.type === 'bike'
    ? `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}&travelmode=walking`
    : (p.url || `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`);
  $('selLink').textContent = p.type === 'bike' ? '徒歩ルートを開く' : 'Googleマップで開く';
  $('selHide').classList.toggle('hide', p.type === 'bike');
}
$('selClear').onclick = () => { selected = null; renderAll(); };
$('selHide').onclick = () => {
  if (!selected || selected.type !== 'place') return;
  const p = lists[selected.li] && lists[selected.li].places[selected.pi]; if (!p) return;
  hidden.add(pk(p)); saveHidden(); selected = null;
  say(`「${p.name}」を隠しました。下の「隠した地点」から戻せます。`); renderAll();
};

function ago(t) {
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'たった今'; if (m < 60) return m + '分前';
  const h = Math.round(m / 60); if (h < 24) return h + '時間前';
  return Math.round(h / 24) + '日前';
}
function renderBike() {
  const has = !!bike;
  $('bikeFind').classList.toggle('hide', !has);
  $('bikeMore').classList.toggle('hide', !has);
  if (!collecting) $('bikeSave').textContent = has ? 'ここに停め直す' : 'ここに停めた';
  const img = $('photo');
  if (!has) { $('bikeInfo').className = 'sub'; $('bikeInfo').textContent = 'まだ保存されていません'; img.classList.add('hide'); return; }
  let t = '';
  if (pos) { const r = distBear(pos, bike); t = `<div class="big">${dirName(r.b)} ${fmtDist(r.d)}</div>`; }
  t += `<div class="sub">${ago(bike.time)}に保存（保存時の誤差 ±${Math.round(bike.acc)}m）</div>`;
  if (bike.acc > 20) t += `<div class="sub">誤差が大きめです。レーダーの薄い円の中を探してください。</div>`;
  if (bike.memo) t += `<div>${esc(bike.memo)}</div>`;
  $('bikeInfo').className = ''; $('bikeInfo').innerHTML = t;
  const ph = store.get('radar.bikePhoto', null);
  img.classList.toggle('hide', !ph); if (ph) img.src = ph;
}
function finishBikeSave() {
  if (!collecting) return;
  const b = collecting.best; clearTimeout(collecting.timer); collecting = null;
  bike = { lat: b.lat, lng: b.lng, acc: b.acc, time: Date.now(), memo: '' };
  store.set('radar.bike', bike); localStorage.removeItem('radar.bikePhoto');
  $('bikeSave').disabled = false;
  say(b.acc > 20
    ? `保存しました（誤差 ±${Math.round(b.acc)}m。屋根の下では大きくなります。メモか写真を残すと安心です）`
    : `保存しました（誤差 ±${Math.round(b.acc)}m）`);
  renderAll();
}
// 測位中に新しい位置が来たら、いちばん誤差の小さいものを残す
function onFix() {
  if (pos.acc < collecting.best.acc) collecting.best = pos;
  $('bikeSave').textContent = `測位中… ±${Math.round(collecting.best.acc)}m`;
  if (collecting.best.acc <= 12) finishBikeSave();
}
$('bikeSave').onclick = () => {
  if (collecting) return;
  if (!pos) return say('位置情報がまだ取れていません。少し待ってからもう一度押してください。');
  if (bike && !confirm('今の場所で自転車の位置を上書きしますか？')) return;
  if (pos.acc <= 12) { collecting = { best: pos, timer: 0 }; return finishBikeSave(); }
  // 誤差が大きいときは最大8秒待って、より良い位置を選ぶ
  collecting = { best: pos, timer: setTimeout(finishBikeSave, 8000) };
  $('bikeSave').disabled = true;
  $('bikeSave').textContent = `測位中… ±${Math.round(pos.acc)}m`;
};
$('bikeFind').onclick = () => {
  if (!bike) return;
  selected = { type: 'bike' };
  if (pos) { const d = distBear(pos, bike).d; setRange(RANGES.find(r => r >= d * 1.3) || RANGES[RANGES.length - 1]); }
  renderAll(); scrollTo({ top: 0, behavior: 'smooth' });
};
$('bikeMemo').onclick = () => {
  const m = prompt('メモ（例：2階 C列）', bike.memo || ''); if (m == null) return;
  bike.memo = m.trim(); store.set('radar.bike', bike); renderAll();
};
$('bikeDel').onclick = () => {
  if (!confirm('自転車の位置を消しますか？')) return;
  bike = null; localStorage.removeItem('radar.bike'); localStorage.removeItem('radar.bikePhoto');
  if (selected && selected.type === 'bike') selected = null; renderAll();
};
$('bikePhotoBtn').onclick = () => $('bikePhotoIn').click();
$('bikePhotoIn').onchange = e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const img = new Image(), u = URL.createObjectURL(f);
  img.onload = () => {
    const k = Math.min(1, 900 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
    if (!store.set('radar.bikePhoto', c.toDataURL('image/jpeg', .7))) say('写真を保存できませんでした');
    renderBike();
  };
  img.onerror = () => { URL.revokeObjectURL(u); say('写真を読み込めませんでした'); };
  img.src = u;
};

function renderLists() {
  const ul = $('lists');
  if (!lists.length) { ul.innerHTML = '<li class="sub">まだリストがありません</li>'; return; }
  ul.innerHTML = lists.map((l, i) =>
    `<li><label><input type="checkbox" data-i="${i}" ${l.visible ? 'checked' : ''}>` +
    `<span class="dot" style="background:${l.color}"></span>` +
    `<span class="nm">${esc(l.name)}　${l.places.length}件` +
    (l.places.some(p => hidden.has(pk(p))) ? `<span class="sub">（${l.places.filter(p => hidden.has(pk(p))).length}件を非表示）</span>` : '') +
    (l.pending && l.pending.length ? `<span class="sub">　＋座標なし ${l.pending.length}件</span>` : '') +
    `</span></label><button class="small" data-del="${i}">削除</button></li>`).join('');
  renderHidden();
}
function hiddenPlaces() {
  const out = [];
  lists.forEach(l => l.places.forEach(p => { if (hidden.has(pk(p))) out.push({ p, l }); }));
  return out;
}
function renderHidden() {
  const hp = hiddenPlaces();
  $('hiddenBox').classList.toggle('hide', !hp.length);
  $('hiddenToggle').textContent = `隠した地点 ${hp.length}件` + (showHidden ? ' ▲' : ' ▼');
  $('hiddenAll').classList.toggle('hide', !showHidden);
  $('hiddenList').innerHTML = !showHidden ? '' : hp.map(({ p, l }) =>
    `<li><span class="dot" style="background:${l.color}"></span><span class="nm">${esc(p.name)}</span>` +
    `<button class="small" data-k="${esc(pk(p))}">戻す</button></li>`).join('');
}
$('hiddenToggle').onclick = () => { showHidden = !showHidden; renderHidden(); };
$('hiddenAll').onclick = () => {
  if (!confirm('隠した地点をすべて表示に戻しますか？')) return;
  hiddenPlaces().forEach(({ p }) => hidden.delete(pk(p))); saveHidden(); renderAll();
};
$('hiddenList').addEventListener('click', e => {
  const k = e.target.dataset.k; if (k == null) return;
  hidden.delete(k); saveHidden(); renderAll();
});
$('lists').addEventListener('change', e => {
  const i = e.target.dataset.i; if (i == null) return;
  lists[i].visible = e.target.checked; saveLists(); selected = null; renderAll();
});
$('lists').addEventListener('click', e => {
  const i = e.target.dataset.del; if (i == null) return;
  if (!confirm(`「${lists[i].name}」を削除しますか？`)) return;
  lists.splice(i, 1); saveLists(); selected = null; renderAll();
});

function nextColor() { return COLORS[lists.length % COLORS.length]; }
function upsertList(name, parsed) {
  let l = lists.find(x => x.name === name);
  if (!l) { l = { name, color: nextColor(), visible: true, places: [], pending: [] }; lists.push(l); }
  l.places = parsed.places; l.pending = parsed.pending || [];
  return l;
}
$('importBtn').onclick = () => $('importIn').click();
$('importIn').onchange = async e => {
  const files = [...e.target.files]; e.target.value = '';
  const notes = [];
  for (const f of files) {
    const name = f.name.replace(/\.[^.]+$/, '');
    try {
      const text = await f.text();
      const parsed = /\.json$/i.test(f.name) || text.trim().startsWith('{') ? parseGeoJSON(text) : parseTakeoutCSV(text);
      if (!parsed.places.length && !parsed.pending.length) { notes.push(`${name}：地点が見つかりません`); continue; }
      upsertList(name, parsed);
      notes.push(`${name}：${parsed.places.length}件` + (parsed.pending.length ? `（座標なし${parsed.pending.length}件は保留）` : ''));
    } catch (err) { notes.push(`${name}：読み込めませんでした`); }
  }
  saveLists(); renderAll(); say(notes.join(' / '));
};
$('addHere').onclick = () => {
  if (!pos) return say('位置情報がまだ取れていません。');
  const n = prompt('この場所の名前'); if (!n || !n.trim()) return;
  let l = lists.find(x => x.name === '手動登録');
  if (!l) { l = { name: '手動登録', color: nextColor(), visible: true, places: [], pending: [] }; lists.push(l); }
  l.places.push({ name: n.trim(), addr: '', url: '', lat: pos.lat, lng: pos.lng });
  saveLists(); renderAll(); say('登録しました');
};

function setRange(r) {
  range = r; store.set('radar.range', r);
  [...$('ranges').children].forEach(b => b.classList.toggle('on', +b.dataset.r === r));
  needDraw = true;
}
$('ranges').innerHTML = RANGES.map(r => `<button data-r="${r}">${fmtDist(r)}</button>`).join('');
$('ranges').addEventListener('click', e => { if (e.target.dataset.r) setRange(+e.target.dataset.r); });

function renderAll() {
  points = allPoints();
  renderStatus(); renderNear(); renderSel(); renderBike(); renderLists();
  needDraw = true;
}
sizeCanvas(); setRange(RANGES.includes(range) ? range : 1000); renderAll();
setInterval(renderBike, 60000);
</script>
</body>
</html>
